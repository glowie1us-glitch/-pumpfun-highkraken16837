name: Pump.fun public monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: pumpfun-public-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public Pump.fun data
        env:
          SOLANA_PUBLIC_WALLET: ${{ vars.SOLANA_PUBLIC_WALLET }}
        run: python scripts/monitor.py
      - name: Run paper-trading simulator (no real transactions)\n        run: python scripts/paper_trader.py\n      - name: Commit snapshots, paper results, and audit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/events.jsonl data/paper_state.json data/paper_trades.jsonl data/paper_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Pump.fun public data"
            git push
          else
            echo "No snapshot changes to commit."
          fi
